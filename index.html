<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSphere: Mars &amp; Forest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top glass">
  <h1>EcoSphere<span>: Mars &amp; Forest</span></h1>
  <div class="status"><i></i> <span id="clock">Сол 1</span> · Биокупол активен</div>
</header>
<main class="layout">
  <aside class="panel glass">
    <h2>Параметры среды</h2>
    <div id="sliders"></div>
    <h2>Системы</h2>
    <div id="toggles" class="tgl-grid"></div>
    <h2>События</h2>
    <div class="btns">
      <button class="btn" id="bMeteor">☄ Метеорит</button>
      <button class="btn" id="bStorm">🌪 Пыльная буря</button>
      <button class="btn" id="bRand">🎲 Случайно</button>
    </div>
    <div class="btns">
      <button class="btn pre" data-p="mars">Марс</button>
      <button class="btn pre" data-p="terra">Терраформ</button>
      <button class="btn pre" data-p="eden">Эдем</button>
    </div>
  </aside>
  <section class="stage glass">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="idx"><small>ЭКО-ИНДЕКС</small><b id="idx">0</b><span id="rank">Мёртвая пустошь</span><div class="bar"><i id="bar"></i></div></div>
      <div class="meters" id="meters"></div>
    </div>
    <div class="hint">Клик по планете — построить биокупол</div>
    <div id="toast"></div>
  </section>
</main>
<section class="console glass">
  <h2>AI-Console</h2>
  <div id="log" role="log" aria-live="polite"></div>
</section>
<script src="script.js"></script>
</body>
</html>
