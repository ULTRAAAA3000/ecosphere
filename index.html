<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcoSphere: Mars &amp; Forest</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top glass">
  <h1>EcoSphere<span>: Mars &amp; Forest</span></h1>
  <div class="status"><i></i> Биокупол активен</div>
</header>
<main class="layout">
  <aside class="panel glass">
    <h2>Панель управления</h2>
    <label class="ctrl">
      <span>Генератор атмосферы <em>Кислород / CO₂</em></span>
      <input type="range" id="atmo" min="0" max="100" value="20">
      <output id="atmoOut">20%</output>
    </label>
    <label class="ctrl">
      <span>Энерго-сеть <em>Солнце / Корневая система</em></span>
      <input type="range" id="energy" min="0" max="100" value="30">
      <output id="energyOut">30%</output>
    </label>
    <button id="nano" class="toggle" aria-pressed="false">
      <span class="dot"></span> Нано-боты терраформирования: <b>ВЫКЛ</b>
    </button>
    <div class="stats">
      <div>Озеленение<b id="sGreen">0%</b></div>
      <div>Биокупола<b id="sDomes">0</b></div>
      <div>Наноботы<b id="sBots">0</b></div>
    </div>
  </aside>
  <section class="stage glass">
    <canvas id="canvas"></canvas>
  </section>
</main>
<section class="console glass">
  <h2>AI-Console</h2>
  <div id="log" role="log" aria-live="polite"></div>
</section>
<script src="script.js"></script>
</body>
</html>
